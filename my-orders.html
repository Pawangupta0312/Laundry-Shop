<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshPress - My Orders</title>
  <style>
    :root {
      --bg-primary: #f2f2f7;
      --bg-surface: rgba(255, 255, 255, 0.75);
      --bg-card: rgba(255, 255, 255, 0.65);
      --border-color: rgba(255, 255, 255, 0.4);
      --border-subtle: rgba(0, 0, 0, 0.08);
      --text-main: #1c1c1e;
      --text-muted: #8e8e93;
      --accent-blue: #007aff;
      --accent-blue-hover: #0056b3;
      --accent-green: #34c759;
      --accent-orange: #ff9500;
      --accent-red: #ff3b30;
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.08);
      --glass-blur: blur(20px) saturate(180%);
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
    }

    [data-theme="dark"] {
      --bg-primary: #000000;
      --bg-surface: rgba(28, 28, 30, 0.78);
      --bg-card: rgba(44, 44, 46, 0.68);
      --border-color: rgba(255, 255, 255, 0.12);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --text-main: #f2f2f7;
      --text-muted: #98989d;
      --accent-blue: #0a84ff;
      --accent-blue-hover: #409cff;
      --accent-green: #30d158;
      --accent-orange: #ff9f0a;
      --accent-red: #ff453a;
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 { width: 380px; height: 380px; background: radial-gradient(circle, #007aff 0%, #af52de 100%); top: -80px; left: -80px; }
    .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, #34c759 0%, #007aff 100%); bottom: -100px; right: -80px; }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 24px;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 1.25rem;
      font-weight: 700;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent-blue), #af52de);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 16px;
      list-style: none;
    }
    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
    }
    .nav-link:hover, .nav-link.active {
      color: var(--text-main);
      background: var(--bg-card);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary { background: var(--accent-blue); color: #ffffff; }
    .btn-secondary { background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-main); }
    .btn-cancel { background: rgba(255, 59, 48, 0.15); color: var(--accent-red); border: 1px solid rgba(255, 59, 48, 0.2); }

    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
      width: 100%;
      flex: 1;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .page-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .filter-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 24px;
    }
    .filter-chip {
      padding: 8px 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .filter-chip.active {
      background: var(--accent-blue);
      color: #fff;
      border-color: var(--accent-blue);
    }

    .orders-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .order-card {
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-pending { background: rgba(255, 149, 0, 0.15); color: var(--accent-orange); }
    .badge-active { background: rgba(0, 122, 255, 0.15); color: var(--accent-blue); }
    .badge-delivered { background: rgba(52, 199, 89, 0.15); color: var(--accent-green); }
    .badge-cancelled { background: rgba(142, 142, 147, 0.15); color: var(--text-muted); }

    .order-details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
    }
    .detail-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .detail-val {
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 2px;
    }

    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
      flex-wrap: wrap;
      gap: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      color: var(--text-muted);
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <header>
    <div class="nav-container">
      <a href="customer.html" class="brand-logo">
        <div class="brand-icon">🧺</div>
        <span>FreshPress</span>
      </a>
      <ul class="nav-links">
        <li><a href="customer.html" class="nav-link">Dashboard</a></li>
        <li><a href="new-order.html" class="nav-link">New Order</a></li>
        <li><a href="my-orders.html" class="nav-link active">My Orders</a></li>
        <li><a href="order-tracking.html" class="nav-link">Track Order</a></li>
        <li><a href="profile.html" class="nav-link">Profile</a></li>
      </ul>
      <button class="theme-toggle" id="theme-btn">🌙</button>
    </div>
  </header>

  <main>
    <div class="title-row">
      <div>
        <h1 class="page-title">Order History</h1>
        <p style="color: var(--text-muted);">Realtime tracking of all your laundry orders</p>
      </div>
      <a href="new-order.html" class="btn btn-primary">➕ Place New Order</a>
    </div>

    <div class="filter-bar" id="filter-bar">
      <button class="filter-chip active" data-filter="ALL">All Orders</button>
      <button class="filter-chip" data-filter="Pending">Pending</button>
      <button class="filter-chip" data-filter="Washing">In Progress</button>
      <button class="filter-chip" data-filter="Ready">Ready</button>
      <button class="filter-chip" data-filter="Out for Delivery">Out for Delivery</button>
      <button class="filter-chip" data-filter="Delivered">Delivered</button>
      <button class="filter-chip" data-filter="Cancelled">Cancelled</button>
    </div>

    <div class="orders-grid" id="orders-list">
      <div class="empty-state">
        <div class="empty-icon">⏳</div>
        <p>Loading your orders from Firebase Realtime Database...</p>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDgDBO5MwwMk1_8JoZCQALJZ6qDkKT6wp0",
      authDomain: "laundry-shop-b6981.firebaseapp.com",
      databaseURL: "https://laundry-shop-b6981-default-rtdb.firebaseio.com",
      projectId: "laundry-shop-b6981",
      storageBucket: "laundry-shop-b6981.firebasestorage.app",
      messagingSenderId: "151928558974",
      appId: "1:151928558974:web:35d60143030176b32e0f2f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // Theme setup
    const themeBtn = document.getElementById('theme-btn');
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️';
    }
    themeBtn.addEventListener('click', () => {
      if (document.documentElement.getAttribute('data-theme') === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeBtn.textContent = '🌙';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeBtn.textContent = '☀️';
      }
    });

    let currentFilter = 'ALL';
    let allOrders = [];

    // Filter Chips
    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.getAttribute('data-filter');
        renderOrders();
      });
    });

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "customer-login.html";
        return;
      }

      // Listen to Orders in Realtime Database
      const ordersRef = ref(database, 'orders');
      onValue(ordersRef, (snapshot) => {
        allOrders = [];
        if (snapshot.exists()) {
          const data = snapshot.val();
          Object.keys(data).forEach(key => {
            const item = data[key];
            if (item.customerId === user.uid) {
              allOrders.push({ dbKey: key, ...item });
            }
          });
        }

        // Sort latest first
        allOrders.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
        renderOrders();
      });
    });

    function renderOrders() {
      const container = document.getElementById('orders-list');

      let filtered = allOrders;
      if (currentFilter !== 'ALL') {
        if (currentFilter === 'Washing') {
          filtered = allOrders.filter(o => ['Picked Up', 'Washing', 'Ironing'].includes(o.orderStatus));
        } else {
          filtered = allOrders.filter(o => o.orderStatus === currentFilter);
        }
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🧺</div>
            <h3>No orders found</h3>
            <p style="margin-top: 6px;">There are no orders matching "${currentFilter}" filter.</p>
          </div>
        `;
        return;
      }

      let html = '';
      filtered.forEach(order => {
        let badgeClass = 'badge-pending';
        const st = order.orderStatus || 'Pending';
        if (st === 'Delivered') badgeClass = 'badge-delivered';
        else if (st === 'Cancelled' || st === 'Rejected') badgeClass = 'badge-cancelled';
        else if (st !== 'Pending') badgeClass = 'badge-active';

        const canCancel = st === 'Pending';
        const createdDate = order.createdAt ? new Date(order.createdAt).toLocaleString() : 'N/A';

        html += `
          <div class="order-card">
            <div class="order-header">
              <div>
                <span style="font-weight: 800; font-size: 1.1rem;">${order.orderId || order.dbKey}</span>
                <span style="font-size: 0.85rem; color: var(--text-muted); margin-left: 10px;">Placed on ${createdDate}</span>
              </div>
              <span class="badge ${badgeClass}">${st}</span>
            </div>

            <div class="order-details-grid">
              <div class="detail-item">
                <span class="detail-label">Service</span>
                <span class="detail-val">${order.service}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Weight / Qty</span>
                <span class="detail-val">${order.weight || order.quantity} kg</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Pickup Date</span>
                <span class="detail-val">${order.pickupDate}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Est. Delivery</span>
                <span class="detail-val">${order.deliveryDate || 'Within 48 hours'}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Payment</span>
                <span class="detail-val">${order.paymentMethod} (${order.paymentStatus})</span>
              </div>
            </div>

            <div class="order-footer">
              <div style="font-size: 1.25rem; font-weight: 800; color: var(--accent-blue);">
                Total: ₹${parseFloat(order.amount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
              </div>
              <div style="display: flex; gap: 10px;">
                ${canCancel ? `<button class="btn btn-cancel cancel-btn" data-id="${order.orderId || order.dbKey}">Cancel Order</button>` : ''}
                <a href="order-tracking.html?orderId=${encodeURIComponent(order.orderId || order.dbKey)}" class="btn btn-primary">Track Live Status &rarr;</a>
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;

      // Attach cancel handlers
      document.querySelectorAll('.cancel-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.getAttribute('data-id');
          if (confirm(`Are you sure you want to cancel order ${id}?`)) {
            await update(ref(database, 'orders/' + id), {
              orderStatus: 'Cancelled'
            });
          }
        });
      });
    }
  </script>
</body>
</html>

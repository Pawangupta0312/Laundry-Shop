<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshPress - Schedule New Order</title>
  <style>
    :root {
      --bg-primary: #f2f2f7;
      --bg-surface: rgba(255, 255, 255, 0.75);
      --bg-card: rgba(255, 255, 255, 0.65);
      --border-color: rgba(255, 255, 255, 0.4);
      --border-subtle: rgba(0, 0, 0, 0.08);
      --text-main: #1c1c1e;
      --text-muted: #8e8e93;
      --accent-blue: #007aff;
      --accent-blue-hover: #0056b3;
      --accent-green: #34c759;
      --accent-purple: #af52de;
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.08);
      --glass-blur: blur(20px) saturate(180%);
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
    }

    [data-theme="dark"] {
      --bg-primary: #000000;
      --bg-surface: rgba(28, 28, 30, 0.78);
      --bg-card: rgba(44, 44, 46, 0.68);
      --border-color: rgba(255, 255, 255, 0.12);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --text-main: #f2f2f7;
      --text-muted: #98989d;
      --accent-blue: #0a84ff;
      --accent-blue-hover: #409cff;
      --accent-green: #30d158;
      --accent-purple: #bf5af2;
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 { width: 380px; height: 380px; background: radial-gradient(circle, #007aff 0%, #af52de 100%); top: -80px; left: -80px; }
    .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, #34c759 0%, #007aff 100%); bottom: -100px; right: -80px; }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 24px;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 1.25rem;
      font-weight: 700;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 16px;
      list-style: none;
    }
    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
    }
    .nav-link:hover, .nav-link.active {
      color: var(--text-main);
      background: var(--bg-card);
    }

    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 24px;
      width: 100%;
      flex: 1;
    }

    .page-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 6px;
    }
    .page-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .glass-card {
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 32px;
      box-shadow: var(--shadow-sm);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 650px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-blue);
    }

    .price-summary-box {
      background: rgba(0, 122, 255, 0.08);
      border: 1px solid rgba(0, 122, 255, 0.2);
      border-radius: var(--radius-sm);
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      margin-bottom: 24px;
    }
    .price-val {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent-blue);
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--accent-blue);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 122, 255, 0.3);
      transition: all 0.2s ease;
    }
    .btn-submit:hover {
      background: var(--accent-blue-hover);
      transform: translateY(-1px);
    }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
    }
    .alert-danger {
      background: rgba(255, 59, 48, 0.15);
      color: #ff3b30;
      border: 1px solid rgba(255, 59, 48, 0.3);
    }
    .alert-success {
      background: rgba(52, 199, 89, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(52, 199, 89, 0.3);
    }
  </style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <header>
    <div class="nav-container">
      <a href="customer.html" class="brand-logo">
        <div class="brand-icon">🧺</div>
        <span>FreshPress</span>
      </a>
      <ul class="nav-links">
        <li><a href="customer.html" class="nav-link">Dashboard</a></li>
        <li><a href="new-order.html" class="nav-link active">New Order</a></li>
        <li><a href="my-orders.html" class="nav-link">My Orders</a></li>
        <li><a href="order-tracking.html" class="nav-link">Track Order</a></li>
        <li><a href="profile.html" class="nav-link">Profile</a></li>
      </ul>
      <button class="theme-toggle" id="theme-btn">🌙</button>
    </div>
  </header>

  <main>
    <h1 class="page-title">Schedule Pickup</h1>
    <p class="page-subtitle">Select your services, specify pickup date & delivery address</p>

    <div class="alert alert-danger" id="error-msg"></div>
    <div class="alert alert-success" id="success-msg"></div>

    <div class="glass-card">
      <form id="order-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="service">Select Service Type</label>
            <select id="service" required>
              <option value="Wash & Fold" data-rate="12">Wash & Fold ($12.00 / kg)</option>
              <option value="Wash & Steam Iron" data-rate="18" selected>Wash & Steam Iron ($18.00 / kg)</option>
              <option value="Dry Cleaning" data-rate="25">Dry Cleaning ($25.00 / item)</option>
              <option value="Bedding & Heavy Fabrics" data-rate="30">Bedding & Heavy Fabrics ($30.00 / item)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="weight">Weight (kg) / Quantity</label>
            <input type="number" id="weight" min="1" max="100" value="3" required />
          </div>

          <div class="form-group">
            <label for="pickup-date">Pickup Date</label>
            <input type="date" id="pickup-date" required />
          </div>

          <div class="form-group">
            <label for="payment-method">Payment Method</label>
            <select id="payment-method" required>
              <option value="Cash on Delivery">Cash on Delivery (COD)</option>
              <option value="Credit/Debit Card">Credit/Debit Card</option>
              <option value="UPI / Online Wallet">UPI / Digital Wallet</option>
            </select>
          </div>

          <div class="form-group full">
            <label for="address">Pickup & Delivery Address</label>
            <textarea id="address" rows="2" required placeholder="Enter full street address..."></textarea>
          </div>
        </div>

        <div class="price-summary-box">
          <div>
            <div style="font-weight: 700; font-size: 1rem;">Calculated Total Amount</div>
            <div style="font-size: 0.85rem; color: var(--text-muted);" id="estimate-text">Includes free doorstep pickup & delivery</div>
          </div>
          <div class="price-val" id="total-amount">$54.00</div>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">Place Laundry Order</button>
      </form>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDgDBO5MwwMk1_8JoZCQALJZ6qDkKT6wp0",
      authDomain: "laundry-shop-b6981.firebaseapp.com",
      databaseURL: "https://laundry-shop-b6981-default-rtdb.firebaseio.com",
      projectId: "laundry-shop-b6981",
      storageBucket: "laundry-shop-b6981.firebasestorage.app",
      messagingSenderId: "151928558974",
      appId: "1:151928558974:web:35d60143030176b32e0f2f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // Set minimum date picker to today
    const pickupDateInput = document.getElementById('pickup-date');
    const todayStr = new Date().toISOString().split('T')[0];
    pickupDateInput.min = todayStr;
    pickupDateInput.value = todayStr;

    // Theme setup
    const themeBtn = document.getElementById('theme-btn');
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️';
    }
    themeBtn.addEventListener('click', () => {
      if (document.documentElement.getAttribute('data-theme') === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeBtn.textContent = '🌙';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeBtn.textContent = '☀️';
      }
    });

    let currentUserData = null;

    // Check user login & preload address
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "customer-login.html";
        return;
      }

      const custSnap = await get(ref(database, 'customers/' + user.uid));
      if (custSnap.exists()) {
        currentUserData = custSnap.val();
        if (currentUserData.address) {
          document.getElementById('address').value = currentUserData.address;
        }
      }
    });

    // Rate calculation
    const serviceSelect = document.getElementById('service');
    const weightInput = document.getElementById('weight');
    const totalAmountEl = document.getElementById('total-amount');

    function calculateTotal() {
      const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
      const rate = parseFloat(selectedOption.getAttribute('data-rate')) || 18;
      const weight = parseFloat(weightInput.value) || 1;
      const total = rate * weight;
      totalAmountEl.textContent = `$${total.toFixed(2)}`;
      return total;
    }

    serviceSelect.addEventListener('change', calculateTotal);
    weightInput.addEventListener('input', calculateTotal);
    calculateTotal();

    const orderForm = document.getElementById('order-form');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    const submitBtn = document.getElementById('submit-btn');

    orderForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting Order to Firebase...';

      const user = auth.currentUser;
      if (!user) {
        errorMsg.textContent = "Session expired. Please log in again.";
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        return;
      }

      const service = serviceSelect.value;
      const weight = parseFloat(weightInput.value) || 1;
      const pickupDate = pickupDateInput.value;
      const address = document.getElementById('address').value.trim();
      const paymentMethod = document.getElementById('payment-method').value;
      const amount = calculateTotal();

      // Estimated delivery date: 2 days after pickup
      const pickupDT = new Date(pickupDate);
      pickupDT.setDate(pickupDT.getDate() + 2);
      const deliveryDate = pickupDT.toISOString().split('T')[0];

      // Generate custom Order ID: e.g. ORD-84920
      const orderNum = Math.floor(100000 + Math.random() * 900000);
      const customOrderId = `ORD-${orderNum}`;

      const customerName = currentUserData?.name || user.email.split('@')[0];

      const orderData = {
        orderId: customOrderId,
        customerId: user.uid,
        customerName: customerName,
        service: service,
        quantity: weight,
        weight: weight,
        address: address,
        pickupDate: pickupDate,
        deliveryDate: deliveryDate,
        amount: amount,
        paymentMethod: paymentMethod,
        paymentStatus: paymentMethod === 'Cash on Delivery' ? 'Pending' : 'Paid',
        orderStatus: 'Pending',
        createdAt: new Date().toISOString()
      };

      try {
        // Save order into Firebase Database under `orders/{customOrderId}`
        await set(ref(database, 'orders/' + customOrderId), orderData);

        // Also push a real-time notification
        const newNotifRef = ref(database, 'notifications/' + Date.now());
        await set(newNotifRef, {
          title: `New Order ${customOrderId}`,
          message: `${customerName} placed a ${service} order ($${amount.toFixed(2)})`,
          timestamp: new Date().toISOString(),
          unread: true
        });

        successMsg.textContent = `Order ${customOrderId} placed successfully! Redirecting to orders...`;
        successMsg.style.display = 'block';

        setTimeout(() => {
          window.location.href = "my-orders.html";
        }, 1500);

      } catch (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Place Laundry Order';
        errorMsg.textContent = error.message.replace('Firebase: ', '');
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>

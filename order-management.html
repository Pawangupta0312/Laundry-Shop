<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshPress - Order Operations Management</title>
  <style>
    :root {
      --bg-primary: #f2f2f7;
      --bg-surface: rgba(255, 255, 255, 0.75);
      --bg-card: rgba(255, 255, 255, 0.65);
      --border-color: rgba(255, 255, 255, 0.4);
      --border-subtle: rgba(0, 0, 0, 0.08);
      --text-main: #1c1c1e;
      --text-muted: #8e8e93;
      --accent-blue: #007aff;
      --accent-blue-hover: #0056b3;
      --accent-purple: #af52de;
      --accent-green: #34c759;
      --accent-orange: #ff9500;
      --accent-red: #ff3b30;
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.04);
      --glass-blur: blur(20px) saturate(180%);
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
    }

    [data-theme="dark"] {
      --bg-primary: #000000;
      --bg-surface: rgba(28, 28, 30, 0.78);
      --bg-card: rgba(44, 44, 46, 0.68);
      --border-color: rgba(255, 255, 255, 0.12);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --text-main: #f2f2f7;
      --text-muted: #98989d;
      --accent-blue: #0a84ff;
      --accent-purple: #bf5af2;
      --accent-green: #30d158;
      --accent-orange: #ff9f0a;
      --accent-red: #ff453a;
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
    }

    .app-container {
      display: flex;
      width: 100%;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    aside {
      width: 260px;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      border-right: 1px solid var(--border-subtle);
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    @media (max-width: 900px) {
      .app-container { flex-direction: column; }
      aside { width: 100%; height: auto; position: relative; }
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      text-decoration: none;
      color: var(--text-main);
    }
    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .nav-item:hover, .nav-item.active {
      color: var(--accent-blue);
      background: var(--bg-card);
    }

    main {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .controls-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 240px;
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    select.filter-select {
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.95rem;
      outline: none;
    }

    .table-card {
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th {
      background: var(--bg-card);
      padding: 14px 20px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-subtle);
    }
    td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.9rem;
    }
    tr:last-child td { border-bottom: none; }

    select.status-dropdown {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.85rem;
    }

    .btn-accept {
      padding: 6px 12px;
      background: rgba(52, 199, 89, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(52, 199, 89, 0.3);
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-accept:hover {
      background: var(--accent-green);
      color: #ffffff;
    }
    .btn-accept:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: rgba(142, 142, 147, 0.15);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }

    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <aside>
      <a href="admin-dashboard.html" class="sidebar-brand">
        <div class="brand-icon">🧺</div>
        <div>
          <div style="font-weight: 800; font-size: 1.1rem;">LaundryOS</div>
          <div style="font-size: 0.75rem; color: var(--text-muted);">Admin Portal</div>
        </div>
      </a>

      <nav class="nav-menu">
        <a href="admin-dashboard.html" class="nav-item">📊 Overview</a>
        <a href="order-management.html" class="nav-item active">🧺 Manage Orders</a>
        <a href="customer-management.html" class="nav-item">👥 Customers</a>
        <a href="analytics.html" class="nav-item">📈 Analytics & Revenue</a>
      </nav>
    </aside>

    <main>
      <div class="top-bar">
        <div>
          <h1 class="page-title">Order Lifecycle Management</h1>
          <p style="color: var(--text-muted);">Real-time status controls for all customer orders</p>
        </div>
        <button class="theme-toggle" id="theme-btn">🌙</button>
      </div>

      <div class="controls-row">
        <input type="text" id="search-input" class="search-input" placeholder="Search by Order ID, Customer Name, or Address..." />
        <select id="status-filter" class="filter-select">
          <option value="ALL">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="Picked Up">Picked Up</option>
          <option value="Washing">Washing</option>
          <option value="Ironing">Ironing</option>
          <option value="Ready">Ready</option>
          <option value="Out for Delivery">Out for Delivery</option>
          <option value="Delivered">Delivered</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>

      <div class="table-card">
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Service Details</th>
                <th>Pickup Date</th>
                <th>Address</th>
                <th>Payment</th>
                <th>Status Control</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="orders-body">
              <tr>
                <td colspan="8" style="text-align: center; color: var(--text-muted); padding: 32px;">
                  Loading orders from Firebase Database...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDgDBO5MwwMk1_8JoZCQALJZ6qDkKT6wp0",
      authDomain: "laundry-shop-b6981.firebaseapp.com",
      databaseURL: "https://laundry-shop-b6981-default-rtdb.firebaseio.com",
      projectId: "laundry-shop-b6981",
      storageBucket: "laundry-shop-b6981.firebasestorage.app",
      messagingSenderId: "151928558974",
      appId: "1:151928558974:web:35d60143030176b32e0f2f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // Theme setup
    const themeBtn = document.getElementById('theme-btn');
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️';
    }
    themeBtn.addEventListener('click', () => {
      if (document.documentElement.getAttribute('data-theme') === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeBtn.textContent = '🌙';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeBtn.textContent = '☀️';
      }
    });

    let allOrders = [];
    const searchInput = document.getElementById('search-input');
    const statusFilter = document.getElementById('status-filter');

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "admin-login.html";
        return;
      }

      onValue(ref(database, 'orders'), (snapshot) => {
        allOrders = [];
        if (snapshot.exists()) {
          const data = snapshot.val();
          Object.keys(data).forEach(key => {
            allOrders.push({ dbKey: key, ...data[key] });
          });
        }
        allOrders.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
        renderOrders();
      });
    });

    searchInput.addEventListener('input', renderOrders);
    statusFilter.addEventListener('change', renderOrders);

    function renderOrders() {
      const tbody = document.getElementById('orders-body');
      const term = searchInput.value.toLowerCase().trim();
      const filterVal = statusFilter.value;

      const filtered = allOrders.filter(o => {
        const matchesTerm = (o.orderId || '').toLowerCase().includes(term) ||
                            (o.customerName || '').toLowerCase().includes(term) ||
                            (o.address || '').toLowerCase().includes(term);

        const matchesStatus = filterVal === 'ALL' || o.orderStatus === filterVal;
        return matchesTerm && matchesStatus;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 32px;">No matching orders found.</td></tr>`;
        return;
      }

      let html = '';
      filtered.forEach(o => {
        const st = o.orderStatus || 'Pending';
        const amt = parseFloat(o.amount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const id = o.orderId || o.dbKey;

        html += `
          <tr>
            <td style="font-weight: 700; font-family: monospace;">${id}</td>
            <td style="font-weight: 700;">${o.customerName || 'Customer'}</td>
            <td>${o.service} (${o.weight || o.quantity} kg)</td>
            <td>${o.pickupDate || 'N/A'}</td>
            <td style="max-width: 160px; color: var(--text-muted); font-size: 0.8rem;">${o.address || 'N/A'}</td>
            <td>
              <div style="font-weight: 700;">₹${amt}</div>
              <select class="pay-select" data-id="${id}" style="font-size: 0.75rem; border-radius: 4px; padding: 2px;">
                <option value="Pending" ${o.paymentStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                <option value="Paid" ${o.paymentStatus === 'Paid' ? 'selected' : ''}>Paid</option>
              </select>
            </td>
            <td>
              <select class="status-dropdown" data-id="${id}">
                <option value="Pending" ${st === 'Pending' ? 'selected' : ''}>Pending</option>
                <option value="Picked Up" ${st === 'Picked Up' ? 'selected' : ''}>Picked Up</option>
                <option value="Washing" ${st === 'Washing' ? 'selected' : ''}>Washing</option>
                <option value="Ironing" ${st === 'Ironing' ? 'selected' : ''}>Ironing</option>
                <option value="Ready" ${st === 'Ready' ? 'selected' : ''}>Ready</option>
                <option value="Out for Delivery" ${st === 'Out for Delivery' ? 'selected' : ''}>Out for Delivery</option>
                <option value="Delivered" ${st === 'Delivered' ? 'selected' : ''}>Delivered</option>
                <option value="Cancelled" ${st === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
              </select>
            </td>
            <td>
              ${st === 'Pending' 
                ? `<button class="btn-accept" data-id="${id}">Accept Order</button>` 
                : `<button class="btn-accept" disabled>Accepted</button>`
              }
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;

      // Attach Status updates
      document.querySelectorAll('.status-dropdown').forEach(sel => {
        sel.addEventListener('change', async (e) => {
          const ordId = e.target.getAttribute('data-id');
          await update(ref(database, 'orders/' + ordId), {
            orderStatus: e.target.value
          });
        });
      });

      // Attach Payment status updates
      document.querySelectorAll('.pay-select').forEach(sel => {
        sel.addEventListener('change', async (e) => {
          const ordId = e.target.getAttribute('data-id');
          await update(ref(database, 'orders/' + ordId), {
            paymentStatus: e.target.value
          });
        });
      });

      // Attach Accept Order Handler
      document.querySelectorAll('.btn-accept').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const ordId = e.target.getAttribute('data-id');
          if (!ordId) return;
          await update(ref(database, 'orders/' + ordId), {
            orderStatus: 'Picked Up'
          });
        });
      });
    }
  </script>
</body>
</html>

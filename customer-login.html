<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshPress - Customer Login</title>
  <style>
    :root {
      --bg-primary: #f2f2f7;
      --bg-surface: rgba(255, 255, 255, 0.75);
      --bg-card: rgba(255, 255, 255, 0.65);
      --border-color: rgba(255, 255, 255, 0.4);
      --border-subtle: rgba(0, 0, 0, 0.08);
      --text-main: #1c1c1e;
      --text-muted: #8e8e93;
      --accent-blue: #007aff;
      --accent-blue-hover: #0056b3;
      --accent-green: #34c759;
      --accent-red: #ff3b30;
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.08);
      --glass-blur: blur(20px) saturate(180%);
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
    }

    [data-theme="dark"] {
      --bg-primary: #000000;
      --bg-surface: rgba(28, 28, 30, 0.78);
      --bg-card: rgba(44, 44, 46, 0.68);
      --border-color: rgba(255, 255, 255, 0.12);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --text-main: #f2f2f7;
      --text-muted: #98989d;
      --accent-blue: #0a84ff;
      --accent-blue-hover: #409cff;
      --accent-green: #30d158;
      --accent-red: #ff453a;
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 { width: 400px; height: 400px; background: radial-gradient(circle, #007aff 0%, #af52de 100%); top: -100px; left: -100px; }
    .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, #34c759 0%, #007aff 100%); bottom: -100px; right: -100px; }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow-lg);
    }

    .header-logo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 1.2rem;
      font-weight: 700;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent-blue), #af52de);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
    }

    h2 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }
    input:focus {
      border-color: var(--accent-blue);
    }

    .forgot-link {
      display: inline-block;
      float: right;
      font-size: 0.85rem;
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 600;
      margin-top: -4px;
      margin-bottom: 16px;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--accent-blue);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 122, 255, 0.3);
      transition: all 0.2s ease;
    }
    .btn-submit:hover {
      background: var(--accent-blue-hover);
      transform: translateY(-1px);
    }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
    }
    .alert-danger {
      background: rgba(255, 59, 48, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(255, 59, 48, 0.3);
    }
    .alert-success {
      background: rgba(52, 199, 89, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(52, 199, 89, 0.3);
    }

    .footer-link {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .footer-link a {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 600;
    }
    .admin-link-box {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
      text-align: center;
      font-size: 0.85rem;
    }
    .admin-link-box a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
    }
    .admin-link-box a:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="login-card">
    <div class="header-logo">
      <a href="index.html" class="brand">
        <div class="brand-icon">🧺</div>
        <span>FreshPress</span>
      </a>
      <button class="theme-toggle" id="theme-btn">🌙</button>
    </div>

    <h2>Welcome Back</h2>
    <p class="subtitle">Log in to manage your orders & schedule pickups</p>

    <div class="alert alert-danger" id="error-msg"></div>
    <div class="alert alert-success" id="success-msg"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="sarah@example.com" />
      </div>

      <div class="form-group" style="margin-bottom: 6px;">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter your password" />
      </div>

      <a href="#" class="forgot-link" id="forgot-btn">Forgot password?</a>
      <div style="clear: both;"></div>

      <button type="submit" class="btn-submit" id="submit-btn">Sign In to Account</button>
    </form>

    <div class="footer-link">
      Don't have a customer account? <a href="customer-signup.html">Create One Now</a>
    </div>

    <div class="admin-link-box">
      Are you a Laundry Administrator? <a href="admin-login.html">Admin Login &rarr;</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDgDBO5MwwMk1_8JoZCQALJZ6qDkKT6wp0",
      authDomain: "laundry-shop-b6981.firebaseapp.com",
      databaseURL: "https://laundry-shop-b6981-default-rtdb.firebaseio.com",
      projectId: "laundry-shop-b6981",
      storageBucket: "laundry-shop-b6981.firebasestorage.app",
      messagingSenderId: "151928558974",
      appId: "1:151928558974:web:35d60143030176b32e0f2f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // Theme setup
    const themeBtn = document.getElementById('theme-btn');
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️';
    }
    themeBtn.addEventListener('click', () => {
      if (document.documentElement.getAttribute('data-theme') === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeBtn.textContent = '🌙';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeBtn.textContent = '☀️';
      }
    });

    // Auto redirect if already logged in
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // Check if admin
        const adminSnap = await get(ref(database, 'admins/' + user.uid));
        if (adminSnap.exists() && adminSnap.val().role === 'admin') {
          window.location.href = "admin-dashboard.html";
        } else {
          window.location.href = "customer.html";
        }
      }
    });

    const loginForm = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    const submitBtn = document.getElementById('submit-btn');
    const forgotBtn = document.getElementById('forgot-btn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Check user role in Firebase Database
        const adminSnap = await get(ref(database, 'admins/' + user.uid));
        if (adminSnap.exists() && adminSnap.val().role === 'admin') {
          window.location.href = "admin-dashboard.html";
        } else {
          window.location.href = "customer.html";
        }
      } catch (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Account';
        errorMsg.textContent = error.message.replace('Firebase: ', '');
        errorMsg.style.display = 'block';
      }
    });

    forgotBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) {
        errorMsg.textContent = "Please enter your email address in the field above first.";
        errorMsg.style.display = 'block';
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        successMsg.textContent = `Password reset link sent to ${email}. Check your inbox.`;
        successMsg.style.display = 'block';
        errorMsg.style.display = 'none';
      } catch (error) {
        errorMsg.textContent = error.message.replace('Firebase: ', '');
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshPress - Customer Directory Management</title>
  <style>
    :root {
      --bg-primary: #f2f2f7;
      --bg-surface: rgba(255, 255, 255, 0.75);
      --bg-card: rgba(255, 255, 255, 0.65);
      --border-color: rgba(255, 255, 255, 0.4);
      --border-subtle: rgba(0, 0, 0, 0.08);
      --text-main: #1c1c1e;
      --text-muted: #8e8e93;
      --accent-blue: #007aff;
      --accent-blue-hover: #0056b3;
      --accent-purple: #af52de;
      --accent-green: #34c759;
      --accent-red: #ff3b30;
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.04);
      --glass-blur: blur(20px) saturate(180%);
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
    }

    [data-theme="dark"] {
      --bg-primary: #000000;
      --bg-surface: rgba(28, 28, 30, 0.78);
      --bg-card: rgba(44, 44, 46, 0.68);
      --border-color: rgba(255, 255, 255, 0.12);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --text-main: #f2f2f7;
      --text-muted: #98989d;
      --accent-blue: #0a84ff;
      --accent-purple: #bf5af2;
      --accent-green: #30d158;
      --accent-red: #ff453a;
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
    }

    .app-container {
      display: flex;
      width: 100%;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    aside {
      width: 260px;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      border-right: 1px solid var(--border-subtle);
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    @media (max-width: 900px) {
      .app-container { flex-direction: column; }
      aside { width: 100%; height: auto; position: relative; }
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      text-decoration: none;
      color: var(--text-main);
    }
    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .nav-item:hover, .nav-item.active {
      color: var(--accent-blue);
      background: var(--bg-card);
    }

    main {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .search-input {
      flex: 1;
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .table-card {
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th {
      background: var(--bg-card);
      padding: 14px 24px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-subtle);
    }
    td {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.95rem;
    }
    tr:last-child td { border-bottom: none; }

    .btn-delete {
      padding: 6px 12px;
      background: rgba(255, 59, 48, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(255, 59, 48, 0.3);
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <aside>
      <a href="admin-dashboard.html" class="sidebar-brand">
        <div class="brand-icon">🧺</div>
        <div>
          <div style="font-weight: 800; font-size: 1.1rem;">LaundryOS</div>
          <div style="font-size: 0.75rem; color: var(--text-muted);">Admin Portal</div>
        </div>
      </a>

      <nav class="nav-menu">
        <a href="admin-dashboard.html" class="nav-item">📊 Overview</a>
        <a href="order-management.html" class="nav-item">🧺 Manage Orders</a>
        <a href="customer-management.html" class="nav-item active">👥 Customers</a>
        <a href="analytics.html" class="nav-item">📈 Analytics & Revenue</a>
      </nav>
    </aside>

    <main>
      <div class="top-bar">
        <div>
          <h1 class="page-title">Registered Customer Database</h1>
          <p style="color: var(--text-muted);">View, search, and manage customer records in Firebase</p>
        </div>
        <button class="theme-toggle" id="theme-btn">🌙</button>
      </div>

      <div class="search-box">
        <input type="text" id="search-input" class="search-input" placeholder="Search by Customer Name, Email, or Phone..." />
      </div>

      <div class="table-card">
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Customer Name</th>
                <th>Email Address</th>
                <th>Phone Number</th>
                <th>Address</th>
                <th>Registered On</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="customers-body">
              <tr>
                <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 32px;">
                  Loading customer database from Firebase...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDgDBO5MwwMk1_8JoZCQALJZ6qDkKT6wp0",
      authDomain: "laundry-shop-b6981.firebaseapp.com",
      databaseURL: "https://laundry-shop-b6981-default-rtdb.firebaseio.com",
      projectId: "laundry-shop-b6981",
      storageBucket: "laundry-shop-b6981.firebasestorage.app",
      messagingSenderId: "151928558974",
      appId: "1:151928558974:web:35d60143030176b32e0f2f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // Theme setup
    const themeBtn = document.getElementById('theme-btn');
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️';
    }
    themeBtn.addEventListener('click', () => {
      if (document.documentElement.getAttribute('data-theme') === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeBtn.textContent = '🌙';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeBtn.textContent = '☀️';
      }
    });

    let customerList = [];
    const searchInput = document.getElementById('search-input');

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "admin-login.html";
        return;
      }

      onValue(ref(database, 'customers'), (snapshot) => {
        customerList = [];
        if (snapshot.exists()) {
          const data = snapshot.val();
          Object.keys(data).forEach(key => {
            customerList.push({ uid: key, ...data[key] });
          });
        }
        renderCustomers();
      });
    });

    searchInput.addEventListener('input', renderCustomers);

    function renderCustomers() {
      const tbody = document.getElementById('customers-body');
      const term = searchInput.value.toLowerCase().trim();

      const filtered = customerList.filter(c => {
        return (c.name || '').toLowerCase().includes(term) ||
               (c.email || '').toLowerCase().includes(term) ||
               (c.phone || '').toLowerCase().includes(term);
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 32px;">No customers found.</td></tr>`;
        return;
      }

      let html = '';
      filtered.forEach(c => {
        const regDate = c.createdAt ? new Date(c.createdAt).toLocaleDateString() : 'N/A';
        html += `
          <tr>
            <td style="font-weight: 700;">${c.name || 'Unnamed Customer'}</td>
            <td>${c.email || 'N/A'}</td>
            <td>${c.phone || 'N/A'}</td>
            <td style="color: var(--text-muted); font-size: 0.85rem; max-width: 200px;">${c.address || 'N/A'}</td>
            <td>${regDate}</td>
            <td>
              <button class="btn-delete" data-uid="${c.uid}">Remove</button>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;

      document.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const uid = e.target.getAttribute('data-uid');
          if (confirm("Are you sure you want to remove this customer record from Firebase database?")) {
            await remove(ref(database, 'customers/' + uid));
          }
        });
      });
    }
  </script>
</body>
</html>

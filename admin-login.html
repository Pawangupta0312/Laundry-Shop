<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshPress - Admin Portal Login</title>
  <style>
    :root {
      --bg-primary: #f2f2f7;
      --bg-surface: rgba(255, 255, 255, 0.75);
      --bg-card: rgba(255, 255, 255, 0.65);
      --border-color: rgba(255, 255, 255, 0.4);
      --border-subtle: rgba(0, 0, 0, 0.08);
      --text-main: #1c1c1e;
      --text-muted: #8e8e93;
      --accent-blue: #007aff;
      --accent-blue-hover: #0056b3;
      --accent-purple: #af52de;
      --accent-green: #34c759;
      --accent-red: #ff3b30;
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.08);
      --glass-blur: blur(20px) saturate(180%);
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
    }

    [data-theme="dark"] {
      --bg-primary: #000000;
      --bg-surface: rgba(28, 28, 30, 0.78);
      --bg-card: rgba(44, 44, 46, 0.68);
      --border-color: rgba(255, 255, 255, 0.12);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --text-main: #f2f2f7;
      --text-muted: #98989d;
      --accent-blue: #0a84ff;
      --accent-blue-hover: #409cff;
      --accent-purple: #bf5af2;
      --accent-green: #30d158;
      --accent-red: #ff453a;
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 { width: 420px; height: 420px; background: radial-gradient(circle, #af52de 0%, #007aff 100%); top: -100px; left: -100px; }
    .orb-2 { width: 420px; height: 420px; background: radial-gradient(circle, #ff9500 0%, #af52de 100%); bottom: -100px; right: -100px; }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow-lg);
    }

    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(175, 82, 222, 0.15);
      color: var(--accent-purple);
      border: 1px solid rgba(175, 82, 222, 0.3);
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .header-logo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 1.2rem;
      font-weight: 700;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
    }

    h2 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }
    input:focus {
      border-color: var(--accent-purple);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(175, 82, 222, 0.3);
      transition: all 0.2s ease;
    }
    .btn-submit:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
    }
    .alert-danger {
      background: rgba(255, 59, 48, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(255, 59, 48, 0.3);
    }
    .alert-success {
      background: rgba(52, 199, 89, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(52, 199, 89, 0.3);
    }

    .footer-link {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .footer-link a {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="login-card">
    <div class="header-logo">
      <a href="index.html" class="brand">
        <div class="brand-icon">⚙️</div>
        <span>FreshPress Admin</span>
      </a>
      <button class="theme-toggle" id="theme-btn">🌙</button>
    </div>

    <div class="admin-badge">🔐 Administrator Portal</div>
    <h2>Admin Sign In</h2>
    <p class="subtitle">Access management control panel, orders & analytics</p>

    <div class="alert alert-danger" id="error-msg"></div>
    <div class="alert alert-success" id="success-msg"></div>

    <form id="admin-login-form">
      <div class="form-group">
        <label for="email">Admin Email Address</label>
        <input type="email" id="email" required placeholder="admin@freshpress.com" />
      </div>

      <div class="form-group">
        <label for="password">Admin Security Password</label>
        <input type="password" id="password" required placeholder="Enter admin password" />
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Authorize & Sign In</button>
    </form>

    <div class="footer-link">
      Not an administrator? <a href="customer-login.html">Customer Sign In</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDgDBO5MwwMk1_8JoZCQALJZ6qDkKT6wp0",
      authDomain: "laundry-shop-b6981.firebaseapp.com",
      databaseURL: "https://laundry-shop-b6981-default-rtdb.firebaseio.com",
      projectId: "laundry-shop-b6981",
      storageBucket: "laundry-shop-b6981.firebasestorage.app",
      messagingSenderId: "151928558974",
      appId: "1:151928558974:web:35d60143030176b32e0f2f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // Theme setup
    const themeBtn = document.getElementById('theme-btn');
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️';
    }
    themeBtn.addEventListener('click', () => {
      if (document.documentElement.getAttribute('data-theme') === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeBtn.textContent = '🌙';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeBtn.textContent = '☀️';
      }
    });

    const loginForm = document.getElementById('admin-login-form');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    const submitBtn = document.getElementById('submit-btn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying Admin Credentials...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        let user;
        try {
          // Attempt sign in with email/pass
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          user = userCredential.user;
        } catch (authErr) {
          // If user doesn't exist yet and contains 'admin', bootstrap new admin account seamlessly
          if (authErr.code === 'auth/user-not-found' || authErr.code === 'auth/invalid-credential') {
            const newAdminCredential = await createUserWithEmailAndPassword(auth, email, password);
            user = newAdminCredential.user;
          } else {
            throw authErr;
          }
        }

        // Check if admin record exists in `admins/{uid}`
        const adminRef = ref(database, 'admins/' + user.uid);
        const adminSnap = await get(adminRef);

        if (!adminSnap.exists()) {
          // Check if admins collection is empty or if this account is registering as admin
          const allAdminsSnap = await get(ref(database, 'admins'));
          const isFirstAdmin = !allAdminsSnap.exists();

          if (isFirstAdmin || email.includes('admin') || user.email === 'pawangupta0312@gmail.com') {
            // Provision Admin Access in Firebase Database
            await set(adminRef, {
              uid: user.uid,
              name: email.split('@')[0],
              email: email,
              role: 'admin',
              createdAt: new Date().toISOString()
            });
          } else {
            errorMsg.textContent = "Access Denied: This account does not have administrator privileges.";
            errorMsg.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Authorize & Sign In';
            return;
          }
        }

        successMsg.textContent = "Admin authorization successful! Redirecting to control panel...";
        successMsg.style.display = 'block';

        setTimeout(() => {
          window.location.href = "admin-dashboard.html";
        }, 1200);

      } catch (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Authorize & Sign In';
        errorMsg.textContent = error.message.replace('Firebase: ', '');
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Laundry Shop - Admin Login</title>

  <!-- Firebase Web Compatibility SDKs for Firebase Auth -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    /* CSS Reset & Material Design System */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-color: #F5F7FB;
      --card-bg: #FFFFFF;
      --sidebar-bg: #0F172A;
      --text-primary: #111111;
      --text-secondary: #666666;
      --text-muted: #999999;
      --accent-blue: #1E88E5;
      --accent-blue-dark: #1565C0;
      --accent-blue-light: #E3F2FD;
      --success: #34C759;
      --success-light: #E8F8EC;
      --warning: #FFB300;
      --error: #FF3B30;
      --error-light: #FFEBEE;
      --border-color: #EEF2F6;
      --shadow-soft: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 20px;
      --radius-sm: 12px;
      --radius-pill: 50px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Admin Centered Viewport Card */
    .admin-auth-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header Link Bar */
    .top-link-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-pill);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: var(--transition);
    }

    .back-btn:active {
      transform: scale(0.96);
    }

    .portal-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0F172A;
      color: #FFFFFF;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
    }

    /* Header Section */
    .admin-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .admin-icon-box {
      width: 76px;
      height: 76px;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.25);
      position: relative;
    }

    .admin-icon-box svg {
      width: 42px;
      height: 42px;
      stroke: var(--accent-blue);
      fill: none;
      stroke-width: 2;
    }

    .shield-badge {
      position: absolute;
      bottom: -4px;
      right: -4px;
      background: var(--accent-blue);
      color: #FFFFFF;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--bg-color);
    }

    .shield-badge svg {
      width: 14px;
      height: 14px;
      stroke: #FFFFFF;
      fill: none;
      stroke-width: 2.5;
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* Alert Banner */
    .alert-banner {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .alert-banner.error {
      background: var(--error-light);
      color: var(--error);
      border: 1px solid #FFCDD2;
      display: flex;
    }

    .alert-banner.success {
      background: var(--success-light);
      color: var(--success);
      border: 1px solid #C8E6C9;
      display: flex;
    }

    /* Form Card */
    .login-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 28px 24px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-soft);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      padding: 14px 14px 14px 44px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-color);
      outline: none;
      transition: var(--transition);
    }

    .form-input:focus {
      background: #FFFFFF;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px var(--accent-blue-light);
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }

    /* Submit Button */
    .primary-btn {
      width: 100%;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      color: #FFFFFF;
      border: none;
      padding: 16px;
      border-radius: var(--radius-pill);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .primary-btn:hover {
      background: linear-gradient(135deg, #1E88E5 0%, #1565C0 100%);
      box-shadow: 0 8px 20px rgba(30, 136, 229, 0.35);
    }

    .primary-btn:active {
      transform: scale(0.98);
    }

    .primary-btn:disabled {
      opacity: 0.75;
      cursor: not-allowed;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Security Note */
    .security-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .security-note svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }
  </style>
</head>
<body>

  <div class="admin-auth-container">

    <!-- Top Links Bar -->
    <div class="top-link-bar">
      <a href="customer.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        <span>Customer App</span>
      </a>
      <span class="portal-badge">
        <span class="badge-dot"></span>
        <span>Admin Mode</span>
      </span>
    </div>

    <!-- Admin Header -->
    <div class="admin-header">
      <div class="admin-icon-box">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <div class="shield-badge">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
      </div>
      <h1 class="title">Admin Console</h1>
      <p class="subtitle">Enter your admin credentials to access shop management</p>
    </div>

    <!-- Alert Banner -->
    <div class="alert-banner" id="alertBanner">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="alertMessage">Error message</span>
    </div>

    <!-- Form Card -->
    <form class="login-card" id="adminLoginForm" onsubmit="handleAdminLogin(event)">

      <!-- Admin Email / Username -->
      <div class="form-group">
        <label for="adminEmail">Admin Email / Username</label>
        <div class="input-wrapper">
          <div class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <input type="email" id="adminEmail" class="form-input" placeholder="admin@laundryshop.com" required autocomplete="username" />
        </div>
      </div>

      <!-- Admin Password -->
      <div class="form-group">
        <label for="adminPassword">Password</label>
        <div class="input-wrapper">
          <div class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <input type="password" id="adminPassword" class="form-input" placeholder="Enter admin password" required autocomplete="current-password" />
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility('adminPassword')" aria-label="Toggle password view">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="primary-btn" id="loginBtn">
        <span class="spinner" id="loginSpinner"></span>
        <span id="loginBtnText">Access Dashboard</span>
      </button>

    </form>

    <!-- Security Footer -->
    <div class="security-note">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>Encrypted Firebase Security Access</span>
    </div>

  </div>

  <script>
    /* ==========================================================================
       Firebase Authentication Setup
       ========================================================================== */
    window.LaundryFirebaseConfig = {
      apiKey: "FIREBASE_API_KEY_PLACEHOLDER",
      authDomain: "laundry-shop-app.firebaseapp.com",
      databaseURL: "https://laundry-shop-app-default-rtdb.firebaseio.com",
      projectId: "laundry-shop-app",
      storageBucket: "laundry-shop-app.appspot.com",
      messagingSenderId: "102030405060",
      appId: "1:102030405060:web:abc123def456"
    };

    let firebaseAuthInstance = null;

    try {
      if (typeof firebase !== 'undefined' && firebase.initializeApp) {
        if (!firebase.apps.length) {
          firebase.initializeApp(window.LaundryFirebaseConfig);
        }
        firebaseAuthInstance = firebase.auth();
      }
    } catch (err) {
      console.warn("Firebase initialization notice:", err);
    }

    /* Toggle Password Visibility */
    function togglePasswordVisibility(inputId) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    }

    /* Banner Alert Controls */
    function showAlert(message, type = 'error') {
      const banner = document.getElementById('alertBanner');
      const msgSpan = document.getElementById('alertMessage');
      banner.className = 'alert-banner ' + type;
      msgSpan.textContent = message;
    }

    function hideAlert() {
      const banner = document.getElementById('alertBanner');
      banner.className = 'alert-banner';
    }

    /* Handle Admin Authentication */
    async function handleAdminLogin(event) {
      event.preventDefault();
      hideAlert();

      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;

      if (!email || !password) {
        showAlert('Please enter both admin email and password.', 'error');
        return;
      }

      const loginBtn = document.getElementById('loginBtn');
      const spinner = document.getElementById('loginSpinner');
      const btnText = document.getElementById('loginBtnText');

      loginBtn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Verifying Admin Privileges...';

      try {
        if (firebaseAuthInstance && window.LaundryFirebaseConfig.apiKey !== 'FIREBASE_API_KEY_PLACEHOLDER') {
          // Live Firebase Sign-In
          const userCredential = await firebaseAuthInstance.signInWithEmailAndPassword(email, password);
          showAlert('Admin verified! Opening Dashboard...', 'success');
          setTimeout(() => {
            window.location.href = 'admin-dashboard.html';
          }, 500);
        } else {
          // Fallback dev handler
          await new Promise(resolve => setTimeout(resolve, 1000));

          if (email.includes('invalid') || !email.includes('@')) {
            throw { code: 'auth/invalid-email', message: 'Invalid admin email format.' };
          }

          showAlert('Admin access authorized! Opening Dashboard...', 'success');
          setTimeout(() => {
            window.location.href = 'admin-dashboard.html';
          }, 600);
        }
      } catch (error) {
        console.error("Admin Login Error:", error);
        let errorMsg = 'Authentication failed. Please check your admin credentials.';

        if (error.code === 'auth/invalid-email') {
          errorMsg = 'Invalid admin email address.';
        } else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
          errorMsg = 'Invalid admin credentials or insufficient privileges.';
        } else if (error.message) {
          errorMsg = error.message;
        }

        showAlert(errorMsg, 'error');
        loginBtn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Access Dashboard';
      }
    }
  </script>
</body>
</html>
